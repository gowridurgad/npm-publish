name: testing-yarn(1477)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack + select Yarn version
        run: |
          corepack enable
          corepack prepare yarn@2.4.3 --activate
          yarn --version

      - name: Setup .yarnrc.yml (only needed for GitHub Packages private scope)
        run: |
            yarn config set npmScopes.gowri48.npmRegistryServer "https://npm.pkg.github.com"
            yarn config set npmScopes.gowri48.npmAlwaysAuth true
            yarn config set npmScopes.gowri48.npmAuthToken "${NPM_AUTH_TOKEN}"
        env:
              NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install (recommended before publish)
        run: yarn install --immutable

      - name: Publish with Yarn Berry
        run: yarn npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
