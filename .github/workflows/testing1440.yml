name: testing_oidc
on:
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
    
      
    steps:
      - uses: actions/checkout@v6
    

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"
          cache: npm
          

      - name: Print .npmrc contents
        run: cat "${NPM_CONFIG_USERCONFIG}"

      - run: npm install
        
      - run: npm publish 
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
   
