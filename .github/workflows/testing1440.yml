name: testing_oidc

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - uses: gowridurgad/setup-node@oidc-1
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm install
