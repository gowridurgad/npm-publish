name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
    

      - uses: gowridurgad/setup-node@auth-token
        with:
          node-version: '26'
          registry-url: "https://registry.npmjs.org"
          cache: npm
          

      - name: Print .npmrc contents
        run: cat "${NPM_CONFIG_USERCONFIG}"

      - run: npm install
        
      - run: npm publish 

   
