name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
   
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
           version: 11
    

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24'
          cache: pnpm


      - run: pnpm install
        
      - run: pnpm publish --no-git-checks
