name: testing_oidc
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
           version: 11
    

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440
        with:
          node-version: '24'
          cache: pnpm
     



      - run: pnpm install
        
      - run: pnpm publish --access public
