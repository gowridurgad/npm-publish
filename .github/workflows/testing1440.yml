name: testing1440
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
            version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: pnpm install
      
      - run: npm publish --access=public
