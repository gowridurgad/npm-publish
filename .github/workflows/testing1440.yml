name: testing_1477_oidc

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required to trigger OIDC token exchange

jobs:
  detect-oidc-precedence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package to publish
        uses: actions/checkout@v6
      

      - name: Checkout custom npm-cli fork (for logging)
        uses: actions/checkout@v6
        with:
          repository: gowridurgad/npm-cli
          ref: testing-oidc
          path: npm-cli  

      - name: Set up Node.js 24 with registry-url
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish with verbose logs
        run: npm publish --access public --provenance --loglevel verbose
     
