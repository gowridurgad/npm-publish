name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
    

      - uses: gowridurgad/setup-node@registrylogic-update
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install latest npm
        run: |
          corepack enable npm
          corepack install -g npm@latest
        
      - run: npm publish 
