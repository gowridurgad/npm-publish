name: testing_1477_oidc
on:
  workflow_dispatch:

# permissions:
#   contents: read
#   id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Satishchoudhary94/setup-node@fix/oidc-support-1440  
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_READ }}
        
