name: testing_oidc
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
    steps:
      - uses: actions/checkout@v6
    

      - uses: gowridurgad/setup-node@registrylogic-update
        with:
          node-version: '24'
          registry-url: "https://npm.pkg.github.com"
          cache: yarn
       
      - run: yarn install
        
      - run: yarn publish 
