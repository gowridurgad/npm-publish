name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: gowridurgad/cli
          ref: testing-oidc
          path: npm-cli

      - uses: pnpm/action-setup@v6
        with:
           version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Install your modified npm CLI
      - name: Install modified npm CLI
        run: |
          cd npm-cli
          npm install
          npm link
        

      - run: pnpm publish --access public --provenance --no-git-checks --loglevel verbose
