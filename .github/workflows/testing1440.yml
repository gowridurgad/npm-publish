name: testing_oidc
on:
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
  
      
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
           version: 11

      - uses: gowridurgad/setup-node@auth-token
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
         
          
      - name: Print .npmrc contents
        run: cat "${NPM_CONFIG_USERCONFIG}"

      - run: pnpm install
        
    
