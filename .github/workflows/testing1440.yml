name: testing_oidc

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
   
      
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
           version: 7

      - uses: gowridurgad/setup-node@removes-dummy
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install
