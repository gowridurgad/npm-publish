name: testing_1477_oidc

on: workflow_dispatch

permissions:
  id-token: write
  contents: read
  
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
        
      - name: Print .npmrc contents
        run: |
          echo "=== .npmrc location ==="
          echo "NPM_CONFIG_USERCONFIG: $NPM_CONFIG_USERCONFIG"
          echo ""
          echo "=== .npmrc contents ==="
          cat "$NPM_CONFIG_USERCONFIG" || cat ~/.npmrc || echo "No .npmrc found"
          echo ""
          echo "=== NODE_AUTH_TOKEN value ==="
          echo "NODE_AUTH_TOKEN: $NODE_AUTH_TOKEN"
          
      - run: npm install -g npm@latest --force  # ensure 11.5.1+
      - run: npm publish --dry-run --loglevel silly
   

     
