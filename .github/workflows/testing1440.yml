name: testing_1477_oidc

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required to trigger OIDC token exchange

jobs:
  detect-oidc-precedence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package to publish
        uses: actions/checkout@v4
      
      - name: Set up Node.js 24 with registry-url
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

     
      - name: Before publish - Check state
        run: |
            echo "=== .npmrc contents ==="
            cat "$NPM_CONFIG_USERCONFIG"
            echo ""
            echo "=== NODE_AUTH_TOKEN ==="
            echo "$NODE_AUTH_TOKEN"
            echo ""
            echo "=== OIDC environment variables ==="
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo 'yes' || echo 'no')"
            echo ""
            echo "=== npm config list ==="
            npm config list

          
      - name: Run npm publish with verbose logging      
        run: |
           npm publish --access public --provenance --loglevel verbose


      - name: Before publish - Check state
        run: |
            echo "=== .npmrc contents ==="
            cat "$NPM_CONFIG_USERCONFIG"
            echo ""
            echo "=== NODE_AUTH_TOKEN ==="
            echo "$NODE_AUTH_TOKEN"
            echo ""
            echo "=== OIDC environment variables ==="
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN exists: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo 'yes' || echo 'no')"
            echo ""
            echo "=== npm config list ==="
            npm config list
