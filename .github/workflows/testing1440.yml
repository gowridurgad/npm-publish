name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: gowridurgad/cli
          ref: testing-oidc
          path: npm-cli

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      # Install your modified npm CLI
      - name: Install modified npm CLI
        run: |
          cd npm-cli
          npm install
          npm link

      # Verify modified npm is being used
      - name: Verify npm version
        run: |
          which npm
          npm --version

      # Run with verbose to see the logs
      - run: npm publish --access public --provenance --loglevel verbose
