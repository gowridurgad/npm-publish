name: testing_oidc
on:
  workflow_dispatch:



jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
    

      - uses: gowridurgad/setup-node@testing-1009
        with:
          node-version: '24' 
          cache: npm
          registry-url: 'https://npm.pkg.github.com'


      - run: npm install
        
      - run: npm publish
        env:
            NODE_AUTH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
