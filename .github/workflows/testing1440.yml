name: testing_oidc
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install -g npm@latest --force  # ensure 11.5.1+

      - uses: gowridurgad/setup-node@registrylogic-update
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"
          cache: npm

     
      - run: npm publish 
